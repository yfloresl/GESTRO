name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: gestro, POSTGRES_DB: gestro, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U gestro" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Estándar Sistemas-Kyros: el compose no carga secretos ni variables sensibles.
      - name: El compose no carga secretos
        run: "! grep -Ei '(password|secret|token|api_?key)[a-z_]*:' docker-compose.yml"
