# gestro.kyros-tech.com: la web (PWA) en la raíz y la API en /api/, bajo un mismo origen:
# sin CORS ni segundo subdominio. El contenedor "api" solo es alcanzable por la red del compose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 17m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /api/ {
        include /etc/nginx/cabeceras.conf;
        # La API ya manda estas cabeceras; se quitan las suyas para no duplicarlas.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        include /etc/nginx/cabeceras.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Aplicación de una sola página: cualquier ruta cae en index.html.
    location / {
        include /etc/nginx/cabeceras.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
